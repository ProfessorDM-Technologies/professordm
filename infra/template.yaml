AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SCRUM-29 Instagram inbound persistence and triage queue

Resources:
  AiJobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  AiJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AiJobsDeadLetterQueue.Arn
        maxReceiveCount: 3

  InstagramWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/ig-webhook/dist/
      Handler: handler.handler
      Runtime: nodejs22.x
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          META_APP_SECRET_PARAMETER: /professordm/staging/meta-app-secret
          SUPABASE_URL_PARAMETER: /professordm/staging/supabase-url
          SUPABASE_SERVICE_ROLE_KEY_PARAMETER: /professordm/staging/supabase-service-role-key
          AI_JOBS_QUEUE_URL: !Ref AiJobsQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AiJobsQueue.Arn
            - Effect: Allow
              Action: ssm:GetParameter
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/professordm/staging/meta-app-secret
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/professordm/staging/supabase-url
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/professordm/staging/supabase-service-role-key
      Events:
        InstagramWebhookPost:
          Type: HttpApi
          Properties:
            Path: /webhooks/instagram
            Method: POST

Outputs:
  AiJobsQueueUrl:
    Value: !Ref AiJobsQueue
  AiJobsDeadLetterQueueUrl:
    Value: !Ref AiJobsDeadLetterQueue
