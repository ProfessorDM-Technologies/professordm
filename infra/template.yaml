AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SCRUM-29 Instagram inbound persistence and triage queue

Parameters:
  MetaAppSecret:
    Type: String
    NoEcho: true
    Description: Supplied at deployment from AWS SSM SecureString; never store in the template
  SupabaseUrl:
    Type: String
    Description: Supabase project URL
  SupabaseServiceRoleKey:
    Type: String
    NoEcho: true
    Description: Supplied at deployment from AWS SSM SecureString; never store in the template

Resources:
  AiJobsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  AiJobsQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AiJobsDeadLetterQueue.Arn
        maxReceiveCount: 3

  InstagramWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../services/ig-webhook/dist/
      Handler: handler.handler
      Runtime: nodejs22.x
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          META_APP_SECRET: !Ref MetaAppSecret
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          AI_JOBS_QUEUE_URL: !Ref AiJobsQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AiJobsQueue.Arn
      Events:
        InstagramWebhookPost:
          Type: HttpApi
          Properties:
            Path: /webhooks/instagram
            Method: POST

Outputs:
  AiJobsQueueUrl:
    Value: !Ref AiJobsQueue
  AiJobsDeadLetterQueueUrl:
    Value: !Ref AiJobsDeadLetterQueue
